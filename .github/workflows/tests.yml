name: Tests

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Regression suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries
        # PyGObject (Linux tray support in requirements.txt) builds against cairo and GObject introspection.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt truststore
          python -m playwright install --with-deps chromium

      - name: Run regression suite with coverage
        env:
          REQUIRE_E2E: "1"
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
