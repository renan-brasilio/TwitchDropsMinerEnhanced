name: Tests

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: Regression suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries
        # PyGObject (Linux tray support in requirements.txt) builds against cairo and GObject introspection.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt truststore
          python -m playwright install --with-deps chromium

      - name: Run regression suite with coverage
        env:
          REQUIRE_E2E: "1"
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
          coverage html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore

  native-shell:
    # The System Events UI smoke (tests/native) needs Accessibility permission, which hosted
    # runners cannot grant; it stays local-only (RUN_NATIVE_UI=1).
    name: Native macOS shell unit tests
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift unit tests
        run: swift test --package-path mac

  docker-image:
    # Builds the server image and checks what a deploy relies on: it turns healthy with
    # API_KEY set, the API rejects requests without the key, and settings survive a restart.
    name: Docker image smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tdme:ci .

      - name: Smoke test
        run: |
          set -eu
          start() {
            docker run -d --name tdme -p 23432:23432 -e API_KEY=ci-key -v tdme-data:/app/data tdme:ci
            for _ in $(seq 30); do
              [ "$(docker inspect tdme --format '{{.State.Health.Status}}')" = healthy ] && return
              sleep 2
            done
            docker logs tdme; exit 1
          }
          start
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:23432/api/status)" = 401
          curl -fsS -H 'X-API-Key: ci-key' -H 'Content-Type: application/json' \
            -d '{"priority": ["Overwatch"]}' localhost:23432/api/settings
          docker rm -f tdme
          start
          curl -fsS -H 'X-API-Key: ci-key' localhost:23432/api/settings | grep -q '"Overwatch"'
