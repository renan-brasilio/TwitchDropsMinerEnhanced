name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt Pillow truststore
          python -m playwright install chromium

      - name: Run regression tests
        env:
          REQUIRE_E2E: "1"
        run: coverage run -m unittest discover -s tests -v && coverage report

      - name: Ensure executable permissions
        run: chmod +x build_mac.sh

      - name: Build macOS App, DMG, and ZIP
        run: ./build_mac.sh
      - name: Determine Release Notes Path
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          FILE="docs/RELEASE_NOTES_${TAG}.md"
          if [ -f "$FILE" ]; then
            echo "path=$FILE" >> $GITHUB_OUTPUT
          elif [ -f "docs/RELEASE_NOTES_v1.0.1.md" ]; then
            echo "path=docs/RELEASE_NOTES_v1.0.1.md" >> $GITHUB_OUTPUT
          else
            echo "path=README.md" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ github.ref_name }}"
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            TwitchDropsMinerEnhanced-${{ github.ref_name }}-macOS-arm64.dmg
            TwitchDropsMinerEnhanced-${{ github.ref_name }}-macOS-arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
