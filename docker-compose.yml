# Standalone use: `API_KEY=... docker compose up -d`, dashboard on http://localhost:23432.
# Behind a reverse proxy (Traefik/Dokploy), drop `ports` and route to container port 23432.
# `latest` is the newest release; pin a version tag (e.g. 1.8.0) to hold one back.
# To build from a checkout instead, replace `image:` with `build: .`.
services:
  miner:
    image: ghcr.io/renan-brasilio/twitchdropsminerenhanced:${TDME_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:23432:23432"
    environment:
      # Required once the dashboard is reachable from other machines.
      - API_KEY=${API_KEY:-}
      # Optional: seeds the Twitch login on first start; the dashboard login works too.
      - TWITCH_AUTH_TOKEN=${TWITCH_AUTH_TOKEN:-}
      - TZ=${TZ:-UTC}
    volumes:
      - miner-data:/app/data

volumes:
  miner-data:
